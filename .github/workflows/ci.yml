name: CI

# PR-only: the squashed main commit is byte-identical to the PR head that
# already passed, and macOS minutes are 10x — re-building it on push is
# pure waste. PR green is the pre-merge (and pre-deploy) validation gate.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macOS minutes bill at 10x on private repos — keep this job lean.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project Ardaas.xcodeproj \
            -scheme Ardaas \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build test
