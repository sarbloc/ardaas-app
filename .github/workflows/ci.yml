name: CI

# PR-only: the squashed main commit is byte-identical to the PR head that
# already passed, and macOS minutes are 10x — re-building it on push is
# pure waste. PR green is the pre-merge (and pre-deploy) validation gate.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macOS minutes bill at 10x on private repos — keep this job lean.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Build what we ship. TestFlight archives with project-onnx.yml (the
      # engine linked, BENTI_ONNX defined), so CI must too — otherwise a
      # compile error inside a `#if BENTI_ONNX` block passes here and only
      # surfaces during a ~150-billed-minute deploy. Costs an SPM resolve of
      # the onnxruntime xcframework per run; if minutes get tight, this is the
      # step to reconsider (and the stock spec still has to build, hence the
      # cheap parse check below).
      - name: Generate Xcode project (engine linked, as shipped)
        run: xcodegen generate --spec project-onnx.yml

      # The stock spec is still the local default (`xcodegen` with no args),
      # so prove it keeps generating. Cheap: no packages resolved, project
      # discarded immediately.
      - name: Validate the stock spec still generates
        run: |
          cp -R Ardaas.xcodeproj /tmp/Ardaas-onnx.xcodeproj
          xcodegen generate
          rm -rf Ardaas.xcodeproj
          cp -R /tmp/Ardaas-onnx.xcodeproj Ardaas.xcodeproj

      - name: Build and test (iOS Simulator)
        run: |
          set -o pipefail
          # Runner images rotate simulator sets (a hardcoded 'iPhone 16'
          # broke on Xcode 16.4's image) — pick the first available iPhone.
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPhone simulator on this runner image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: ${DEVICE}"
          xcodebuild \
            -project Ardaas.xcodeproj \
            -scheme Ardaas \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            CODE_SIGNING_ALLOWED=NO \
            build test
