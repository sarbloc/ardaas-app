name: CI

# PR-only: the squashed main commit is byte-identical to the PR head that
# already passed, and macOS minutes are 10x — re-building it on push is
# pure waste. PR green is the pre-merge (and pre-deploy) validation gate.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether anything iOS-affecting changed. Runs on Linux (1x) so the
  # decision itself is near-free. Deliberately no third-party action: a plain
  # `git diff` against the base ref has no supply-chain surface and no version
  # to keep current.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit present to diff against it.
          fetch-depth: 0

      - name: Detect iOS-affecting changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"
          CHANGED="${RUNNER_TEMP}/changed-files.z"

          # -z keeps paths NUL-delimited and therefore literal. Without it Git
          # quotes and escapes any non-ASCII path, so a Gurmukhi-named source
          # (Ardaas/ਪੰਜਾਬੀ.swift) arrives as "\340\250\252..." — the Ardaas/
          # prefix stops matching and the build is skipped. This repo ships
          # Gurmukhi, so that is a live case, not a hypothetical.
          #
          # --no-renames because a detected rename reports only its
          # destination: moving a file OUT of Ardaas/ into docs/ would read as
          # a non-iOS change while actually removing a source from the target.
          git diff -z --name-only --no-renames "${BASE}...HEAD" > "${CHANGED}"

          echo "Changed files:"
          tr '\0' '\n' < "${CHANGED}" | sed 's/^/  /'

          # Matched from a file, never through a pipe. `echo "$FILES" | grep -q`
          # looks equivalent but is not: grep exits at the first match, the
          # writer dies of SIGPIPE (141), and `pipefail` turns that into a
          # failed pipeline — so a MATCH reads as "no iOS changes". A diff with
          # an iOS file near the top and a few thousand Android files after it
          # would skip the build and still pass the required gate.
          #
          # Ardaas/Resources/** sits inside Ardaas/**, so a scripture
          # correction still builds iOS — as it must.
          if grep -qzE '^(Ardaas/|ArdaasTests/|project\.yml$|project-onnx\.yml$|deploy/|\.github/workflows/ci\.yml$)' "${CHANGED}"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS-affecting changes found — running the macOS build."
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No iOS-affecting changes — skipping the macOS build."
          fi

  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # macOS minutes bill at 10x — keep this job lean, and only reach it when
    # something it compiles has actually changed.
    # xcode-27: the Apple Silicon image with Xcode 27.1, whose iOS 27.1 SDK
    # is what lays the app out full screen on the iPhone Duo's inner display
    # (pre-27 SDK builds are letterboxed there) (#170).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pinned, not the image default: a default bump must not silently move
      # the SDK we build against. Keep in sync with deploy-testflight.yml.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Build what we ship. TestFlight archives with project-onnx.yml (the
      # engine linked, BENTI_ONNX defined), so CI must too — otherwise a
      # compile error inside a `#if BENTI_ONNX` block passes here and only
      # surfaces during a ~150-billed-minute deploy. Costs an SPM resolve of
      # the onnxruntime xcframework per run; if minutes get tight, this is the
      # step to reconsider (and the stock spec still has to build, hence the
      # cheap parse check below).
      - name: Generate Xcode project (engine linked, as shipped)
        run: xcodegen generate --spec project-onnx.yml

      # The stock spec is still the local default (`xcodegen` with no args),
      # so prove it keeps generating. Cheap: no packages resolved, project
      # discarded immediately.
      - name: Validate the stock spec still generates
        run: |
          cp -R Ardaas.xcodeproj /tmp/Ardaas-onnx.xcodeproj
          xcodegen generate
          rm -rf Ardaas.xcodeproj
          cp -R /tmp/Ardaas-onnx.xcodeproj Ardaas.xcodeproj

      # TEMP (#171 screenshots, dropped before merge): boot the iOS 27.1
      # iPhone Duo and unfold it, so the UI test sees the inner screen.
      # hinge is pinned to a reviewed commit (MIT, no network access).
      - name: TEMP unfold the iPhone Duo
        run: |
          set -euo pipefail
          git clone -q https://github.com/artemnovichkov/hinge.git /tmp/hinge
          git -C /tmp/hinge checkout -q afb8f0b
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS-27-1" in runtime:
                  for d in devices:
                      if d["name"] == "iPhone Duo":
                          print(d["udid"]); sys.exit()
          ')
          echo "Duo: ${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          /tmp/hinge/bin/hinge -d "${UDID}" open
          /tmp/hinge/bin/hinge -d "${UDID}" posture || true
          echo "DUO_UDID=${UDID}" >> "$GITHUB_ENV"

      - name: Build and test (iOS Simulator)
        run: |
          set -o pipefail
          # Prefer the iPhone Duo: it is the only simulator the iOS 27.1
          # runtime ships, and the device the 27.1 SDK exists for.
          # OS=latest pins it to that runtime, not an older one on the image.
          # Otherwise fall back to the first available iPhone. Runner images
          # rotate simulator sets (a hardcoded 'iPhone 16' broke on Xcode
          # 16.4's image), so never hardcode a fallback.
          if [ -n "${DUO_UDID:-}" ]; then
            DEST="platform=iOS Simulator,id=${DUO_UDID}"
          elif xcrun simctl list devices available | grep -q 'iPhone Duo ('; then
            DEST="platform=iOS Simulator,name=iPhone Duo,OS=latest"
          else
            DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -1 | xargs)
            if [ -z "$DEVICE" ]; then
              echo "::error::No available iPhone simulator on this runner image"
              xcrun simctl list devices available
              exit 1
            fi
            echo "::warning::No iPhone Duo simulator; falling back to ${DEVICE}"
            DEST="platform=iOS Simulator,name=${DEVICE}"
          fi
          echo "Using destination: ${DEST}"
          xcodebuild \
            -project Ardaas.xcodeproj \
            -scheme Ardaas \
            -destination "${DEST}" \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: TEMP Duo posture after the tests
        if: always()
        run: /tmp/hinge/bin/hinge -d "${DUO_UDID}" posture || true

      # TEMP (#171 screenshots, dropped before merge).
      - name: Upload Duo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-shots
          path: ~/duo-shots
          if-no-files-found: warn

  # The required status check (branch protection, strict: true).
  #
  # It must ALWAYS run and always report, which is why it is a separate Linux
  # job rather than the macOS build itself. A plain `paths:` filter on the
  # workflow would leave this check permanently pending on an Android-only PR,
  # and branch protection would block the merge forever.
  #
  # `if: always()` so it still reports when ios-build is skipped; the explicit
  # result check is because a skipped or cancelled dependency must not be
  # mistaken for a pass.
  build-test:
    needs: [changes, ios-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the macOS build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IOS_RESULT: ${{ needs.ios-build.result }}
          IOS_NEEDED: ${{ needs.changes.outputs.ios }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT} ios-build=${IOS_RESULT} ios-needed=${IOS_NEEDED}"

          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Change detection did not succeed — refusing to pass the gate."
            exit 1
          fi

          if [ "${IOS_NEEDED}" = "true" ]; then
            if [ "${IOS_RESULT}" != "success" ]; then
              echo "::error::iOS build did not succeed (${IOS_RESULT})."
              exit 1
            fi
            echo "iOS build passed."
          else
            if [ "${IOS_RESULT}" != "skipped" ]; then
              echo "::error::iOS build was not needed but reported '${IOS_RESULT}' — unexpected, failing loudly."
              exit 1
            fi
            echo "No iOS-affecting changes; macOS build correctly skipped."
          fi
