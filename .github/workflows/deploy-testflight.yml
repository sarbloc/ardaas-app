name: TestFlight

on:
  push:
    branches: [main]
    # Only deploy when something the iOS app actually ships has changed.
    # Without this, an Android-only merge costs ~150 billed macOS minutes,
    # and consumes a build number.
    #
    # Ardaas/Resources/** is inside Ardaas/**, so a scripture correction still
    # deploys, as it must.
    paths:
      - 'Ardaas/**'
      - 'ArdaasTests/**'
      - 'project.yml'
      - 'project-onnx.yml'
      - 'deploy/**'
      - '.github/workflows/deploy-testflight.yml'
  workflow_dispatch:

# Queue uploads, never kill one mid-flight.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    # Kill switch for AUTOMATIC deploys: a main merge deploys only while the
    # repo variable TESTFLIGHT_ENABLED is "true" (`gh variable set
    # TESTFLIGHT_ENABLED --body true`). Unset/false → the push run skips at
    # zero cost. Off by default since launch: releases are deliberate.
    #
    # A manual "Run workflow" always deploys, regardless of the switch — so
    # shipping a release never means flipping it on and remembering to flip
    # it back off. Dispatch from main only (see the build-number note below).
    if: github.event_name == 'workflow_dispatch' || vars.TESTFLIGHT_ENABLED == 'true'
    # macOS minutes bill at 10x — this job costs ~150 billed minutes per
    # main merge. Pause with the kill switch when minutes matter.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count on main.
          fetch-depth: 0

      - name: Verify App Store Connect secrets exist
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY_P8" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::App Store Connect API secrets are not configured (APP_STORE_CONNECT_API_KEY_P8 / _KEY_ID / _ISSUER_ID)"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # Ships the on-device translation engine (#35): project-onnx.yml is
      # project.yml plus the ONNX Runtime package and BENTI_ONNX. Without it
      # Compose hides the Translate action, which is why TestFlight builds
      # showed no translation despite the feature being on main.
      - name: Generate Xcode project (engine linked)
        run: xcodegen generate --spec project-onnx.yml

      - name: Write API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p private_keys
          printf '%s' "$API_KEY_P8" > "private_keys/AuthKey_${API_KEY_ID}.p8"

      # Build number = commit count on the checked-out ref: monotonic for
      # main pushes and traceable to a commit. Known constraints, accepted:
      # re-running after a SUCCESSFUL upload fails on "duplicate build"
      # (correct — that build is already up), and workflow_dispatch should
      # only be run from the main tip.
      #
      # The archive is deliberately UNSIGNED and never talks to the developer
      # account; -exportArchive below does all the signing (#57). Signing the
      # archive under automatic signing always uses an *Apple Development*
      # identity, and a fresh runner has none in its keychain, so
      # -allowProvisioningUpdates minted a new development certificate on every
      # run until the account hit Apple's cap ("Choose a certificate to revoke").
      # Pinning the archive to Release (#63) or to CODE_SIGN_IDENTITY=Apple
      # Distribution (#62) did not change that. The export re-signs for App
      # Store distribution with Apple's cloud-managed distribution certificate,
      # which it already did before this change and which creates nothing.
      #
      # This relies on the app having no entitlements file / capabilities: an
      # unsigned archive carries no entitlements, so the export signs with the
      # baseline ones from the App Store profile. Adding a capability (push,
      # app groups, iCloud…) means ad-hoc signing the archived app with its
      # .entitlements file before export, or the capability is silently lost.
      - name: Archive, unsigned (build number = commit count)
        run: |
          set -o pipefail
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "Build number: ${BUILD_NUMBER}"
          xcodebuild archive \
            -project Ardaas.xcodeproj \
            -scheme Ardaas \
            -destination 'generic/platform=iOS' \
            -archivePath build/Ardaas.xcarchive \
            -configuration Release \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO

      # Fail fast if anything signed the archive with a certificate — that is
      # the path that minted a development certificate per run (#57). The
      # linker's ad-hoc signature is expected and carries no Authority.
      - name: Assert the archive carries no certificate signature
        run: |
          set -euo pipefail
          APP="build/Ardaas.xcarchive/Products/Applications/Ardaas.app"
          SIGNATURE=$(codesign -dvv "${APP}" 2>&1 || true)
          echo "${SIGNATURE}"
          if grep -q '^Authority=' <<<"${SIGNATURE}"; then
            echo "::error::The archive was signed with a certificate. It must be unsigned so that no development certificate is created (#57)."
            exit 1
          fi

      # ONNX Runtime ships a STATIC archive inside a framework wrapper (its
      # binary is an `ar` archive, not a dylib), so its code is linked into the
      # app binary. Xcode cannot tell the difference and copies the wrapper
      # into Ardaas.app/Frameworks/ anyway, where App Store validation reads it
      # as a framework with no usable min-OS load command:
      #   ITMS-90208 ... does not support the minimum OS Version
      # `embed: false` in project-onnx.yml did not stop it (builds 30 and 31
      # were both rejected), so remove it from the archive — but only after
      # proving nothing actually links against it at runtime. If anything does,
      # stripping would crash on launch, so fail instead of shipping that.
      - name: Strip the wrongly-embedded static framework
        run: |
          set -euo pipefail
          APP="build/Ardaas.xcarchive/Products/Applications/Ardaas.app"
          echo "--- Frameworks/ before:"
          ls -la "${APP}/Frameworks" 2>/dev/null || echo "(no Frameworks directory)"

          if otool -L "${APP}/Ardaas" | grep -qi onnxruntime; then
            echo "::error::Ardaas dynamically links onnxruntime — it is not the static build this strip assumes. Do not strip; investigate."
            otool -L "${APP}/Ardaas" | grep -i onnx
            exit 1
          fi
          echo "Confirmed: no dynamic link against onnxruntime, so its code is static in the app binary."

          if [ -d "${APP}/Frameworks/onnxruntime.framework" ]; then
            rm -rf "${APP}/Frameworks/onnxruntime.framework"
            echo "Removed the embedded onnxruntime.framework."
          else
            echo "Nothing to remove — project-onnx.yml's embed:false did the job."
          fi

          # An empty Frameworks/ is itself a validation smell; drop it.
          rmdir "${APP}/Frameworks" 2>/dev/null && echo "Removed the now-empty Frameworks/." || true

          echo "--- Frameworks/ after:"
          ls -la "${APP}/Frameworks" 2>/dev/null || echo "(no Frameworks directory)"

      - name: Export and upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Ardaas.xcarchive \
            -exportOptionsPlist deploy/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}" \
            2>&1 | tee build/export.log

      # Diagnostic only: which identities the export signed with, from the
      # distribution logs xcodebuild leaves behind. Expect "Apple Distribution"
      # and no "Apple Development" — the evidence that #57 stays fixed.
      - name: Signing summary
        if: always()
        continue-on-error: true
        run: |
          LOGS=$(sed -n 's/.*Created bundle at path "\(.*\.xcdistributionlogs\)".*/\1/p' build/export.log 2>/dev/null | tail -n 1)
          if [ -z "${LOGS}" ] || [ ! -d "${LOGS}" ]; then
            echo "No distribution logs found."
            exit 0
          fi
          grep -rhoiE '(Apple|iPhone) (Distribution|Development)[^"<,]*|[A-Za-z ]*certificate[A-Za-z ]*' "${LOGS}" \
            | sed 's/^ *//' | sort | uniq -c | sort -rn | head -n 40

      - name: Clean up API key
        if: always()
        run: rm -rf private_keys
