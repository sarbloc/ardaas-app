name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue uploads, never kill one mid-flight.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    # Kill switch: deploys run only while the repo variable
    # TESTFLIGHT_ENABLED is "true" (repo Settings → Secrets and variables
    # → Actions → Variables, or `gh variable set TESTFLIGHT_ENABLED
    # --body true`). Unset/false → the job skips at zero cost.
    if: vars.TESTFLIGHT_ENABLED == 'true'
    # macOS minutes bill at 10x — this job costs ~150 billed minutes per
    # main merge. Pause with the kill switch when minutes matter.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count on main.
          fetch-depth: 0

      - name: Verify App Store Connect secrets exist
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY_P8" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::App Store Connect API secrets are not configured (APP_STORE_CONNECT_API_KEY_P8 / _KEY_ID / _ISSUER_ID)"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p private_keys
          printf '%s' "$API_KEY_P8" > "private_keys/AuthKey_${API_KEY_ID}.p8"

      # Build number = commit count on the checked-out ref: monotonic for
      # main pushes and traceable to a commit. Known constraints, accepted:
      # re-running after a SUCCESSFUL upload fails on "duplicate build"
      # (correct — that build is already up), and workflow_dispatch should
      # only be run from the main tip.
      - name: Archive (build number = commit count)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "Build number: ${BUILD_NUMBER}"
          xcodebuild archive \
            -project Ardaas.xcodeproj \
            -scheme Ardaas \
            -destination 'generic/platform=iOS' \
            -archivePath build/Ardaas.xcarchive \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}"

      - name: Export and upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Ardaas.xcarchive \
            -exportOptionsPlist deploy/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}"

      - name: Clean up API key
        if: always()
        run: rm -rf private_keys
