name: Ardaas
options:
  bundleIdPrefix: io.sarbloc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Ardaas:
    type: application
    platform: iOS
    sources: [Ardaas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sarbloc.ardaas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ardaas
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  ArdaasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ArdaasTests]
    dependencies:
      - target: Ardaas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sarbloc.ardaas-tests
schemes:
  Ardaas:
    build:
      targets:
        Ardaas: all
        ArdaasTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ArdaasTests
