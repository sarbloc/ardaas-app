name: Ardaas
options:
  bundleIdPrefix: io.sarbloc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Ardaas:
    type: application
    platform: iOS
    sources: [Ardaas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sarbloc.ardaas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ardaas
        # App Store validation (ITMS-90474) requires explicit orientations;
        # iPad must declare all four for multitasking support.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UMJLF8TF7J
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        # Archive with a DISTRIBUTION identity. Without this Xcode defaults
        # CODE_SIGN_IDENTITY to "Apple Development" in every configuration, so
        # `xcodebuild archive` signed with a development identity and a Team
        # Provisioning Profile (confirmed in the deploy logs). Each CI runner
        # is a fresh machine with no keychain, so cloud signing could not reuse
        # the existing development certificate's private key and minted a new
        # one per run — twelve runs later the account hit Apple's certificate
        # limit and deploys wedged (#57). Debug is untouched, so local
        # development still signs with Apple Development as normal.
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
  ArdaasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ArdaasTests]
    dependencies:
      - target: Ardaas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sarbloc.ardaas-tests
schemes:
  Ardaas:
    build:
      targets:
        Ardaas: all
        ArdaasTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ArdaasTests
